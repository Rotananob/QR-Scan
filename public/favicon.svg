<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#6366f1"/>
  <!-- QR Code pattern -->
  <!-- Top-left finder -->
  <rect x="4" y="4" width="10" height="10" rx="1.5" fill="white"/>
  <rect x="6" y="6" width="6" height="6" rx="0.5" fill="#6366f1"/>
  <rect x="7.5" y="7.5" width="3" height="3" fill="white"/>
  <!-- Top-right finder -->
  <rect x="18" y="4" width="10" height="10" rx="1.5" fill="white"/>
  <rect x="20" y="6" width="6" height="6" rx="0.5" fill="#6366f1"/>
  <rect x="21.5" y="7.5" width="3" height="3" fill="white"/>
  <!-- Bottom-left finder -->
  <rect x="4" y="18" width="10" height="10" rx="1.5" fill="white"/>
  <rect x="6" y="20" width="6" height="6" rx="0.5" fill="#6366f1"/>
  <rect x="7.5" y="21.5" width="3" height="3" fill="white"/>
  <!-- Data modules -->
  <rect x="16" y="16" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="20" y="16" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="24" y="16" width="3" height="3" rx="0.5" fill="white" opacity="0.7"/>
  <rect x="16" y="20" width="3" height="3" rx="0.5" fill="white" opacity="0.7"/>
  <rect x="24" y="20" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="16" y="24" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="20" y="24" width="3" height="3" rx="0.5" fill="white" opacity="0.7"/>
  <rect x="24" y="24" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
</svg>
